<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="icon" type="image/webp" href="google.webp">
    <style>
        body {
            background-color: #202124;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .status-box {
            text-align: center;
        }
        .loader {
            border: 4px solid #3c4043;
            border-top: 4px solid #8ab4f8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="status-box">
        <div class="loader"></div>
        <p id="statusText">Flooding history (0/100)...</p>
    </div>

    <script>
        const pool = [
            "cats", "dogs", "science", "math", "history", "space", "coding", "gaming", "music", "art",
            "sports", "cooking", "travel", "books", "movies", "nature", "physics", "chemistry", "biology", "geography",
            "technology", "computers", "phones", "cars", "planes", "trains", "architecture", "design", "photography", "finance",
            "economics", "psychology", "philosophy", "sociology", "astronomy", "geology", "botany", "zoology", "meteorology", "oceanography"
        ];

        let count = 0;
        const total = 100;
        const statusText = document.getElementById('statusText');

        // Create a hidden iframe pointing to google.webp to force Chrome's favicon database to index the icon per URL
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const interval = setInterval(() => {
            if (count < total) {
                const w1 = pool[Math.floor(Math.random() * pool.length)];
                const w2 = pool[Math.floor(Math.random() * pool.length)];
                const w3 = pool[Math.floor(Math.random() * pool.length)];
                const query = `${w1} ${w2} ${w3} facts`;
                
                document.title = `${query} - Google Search`;
                
                const targetUrl = `google.webp?q=${encodeURIComponent(query)}&t=${Date.now()}_${count}`;
                
                try {
                    // Push state and load the icon resource into the background iframe simultaneously 
                    // so Chrome binds the favicon asset directly to the history entries
                    history.pushState({ page: count }, "", `?q=${encodeURIComponent(query)}&t=${Date.now()}_${count}`);
                    iframe.src = targetUrl;
                } catch (e) {}

                count++;
                statusText.textContent = `Flooding history (${count}/${total})...`;
            } else {
                clearInterval(interval);
                statusText.textContent = "Complete! Closing window...";
                
                setTimeout(() => {
                    window.close();
                }, 600);
            }
        }, 35);
    </script>

</body>
</html>
