<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobTop Games Logo Generator</title>
  <link rel="icon" type="image/png" href="Favicons/favicon.png">
  <link rel="stylesheet" href="btnAnim.css">
  <style>
    @font-face {
      font-family: 'Pusab';
      src: url('fonts/pusab.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 30px;
      gap: 10px;
      background-color: #2b2b2b;
      background-image: url('img/bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
    }

    /* Top Navigation / Control Bar */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 100;
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .back-btn-container img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    .right-panels {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    /* Color Panel styled with img/GJ_square01-uhd.png */
    .color-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 14px 12px 14px;
      border-style: solid;
      border-width: 16px;
      border-image-source: url('img/GJ_square01-uhd.png');
      border-image-slice: 48 fill;
      border-image-repeat: stretch;
    }

    .color-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 48px;
      margin-bottom: 2px;
    }

    .color-panel-title {
      font-family: 'Pusab', sans-serif;
      font-size: 15px;
      color: #ffc800;
      -webkit-text-stroke: 1.5px #000000;
      paint-order: stroke fill;
      user-select: none;
    }

    .reset-btn {
      width: 60px;
      height: 60px;
      object-fit: contain;
      cursor: pointer;
      z-index: 20;
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .color-label {
      font-family: 'Pusab', sans-serif;
      font-size: 13px;
      color: #ffffff;
      -webkit-text-stroke: 1.5px #000000;
      paint-order: stroke fill;
      user-select: none;
      white-space: nowrap;
    }

    .hex-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hex-input {
      width: 82px;
      padding: 4px 6px;
      font-family: 'Pusab', sans-serif;
      font-size: 14px;
      color: #ffffff;
      -webkit-text-stroke: 1.2px #000000;
      paint-order: stroke fill;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(0, 0, 0, 0.65);
      border-radius: 6px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      letter-spacing: 0.5px;
    }

    .hex-input:focus {
      border-color: #ffc800;
    }

    .hex-input::placeholder {
      color: #bbbbbb;
      -webkit-text-stroke: 1px #000000;
    }

    .color-swatch-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 2px solid #000000;
      flex-shrink: 0;
      cursor: pointer;
    }

    .color-swatch:hover {
      border-color: #ffc800;
    }

    /* Hidden native color picker for popup */
    .color-picker-native {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .layer-toggles {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .toggle-label {
      font-family: 'Pusab', sans-serif;
      font-size: 14px;
      color: #ffffff;
      -webkit-text-stroke: 1.5px #000000;
      paint-order: stroke fill;
      user-select: none;
    }

    .toggle-btn {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .logo-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      padding: 0 20px;
      margin-top: 40px;
    }

    svg#logoSvg {
      overflow: visible;
      display: block;
      width: 100%;
      max-width: 820px;
      height: auto;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      width: 100%;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .message-label {
      font-family: 'Pusab', sans-serif;
      font-size: 33px;
      line-height: 1;
      color: #ffc800;
      -webkit-text-stroke: 3px #000000;
      paint-order: stroke fill;
      letter-spacing: 0.75px;
      user-select: none;
      text-align: center;
      transform: translateY(-5px);
    }

    .gj-frame {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: 750px;
      max-width: 100%;
      padding: 22px 52px 38px 52px;
      border-style: solid;
      border-width: 36px;
      border-image-source: url('img/GJ_square01-uhd.png');
      border-image-slice: 48 fill;
      border-image-repeat: stretch;
    }

    .gj-frame textarea {
      padding: 18px 27px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 27px;
      line-height: 1.35;
      border-radius: 12px;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      outline: none;
      text-align: center;
      width: 100%;
      min-height: 75px;
      resize: none;
      overflow: hidden;
    }

    textarea::placeholder {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #c8c8c8;
    }

    textarea:focus {
      outline: none;
      box-shadow: none;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
      margin-top: 9px;
    }

    .action-btn {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .copy-notification {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      font-family: 'Pusab', sans-serif;
      font-size: 28px;
      color: #ffffff;
      -webkit-text-stroke: 2px #000000;
      paint-order: stroke fill;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 24px;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1000;
    }
    .copy-notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .logo-text {
      font-family: 'Pusab', sans-serif;
      font-size: 20px;
      letter-spacing: -0.2px;
      word-spacing: 4px;
      text-anchor: middle;
      dominant-baseline: central;
      stroke-linejoin: round;
      stroke-linecap: round;
      paint-order: stroke fill;
      user-select: none;
    }

    /* Layer Base Styles */
    .layer-shadow {
      fill: var(--shadow-color, #000000);
      filter: url(#uniformShadow10);
      opacity: 1;
    }

    .layer-outer-rim {
      fill: url(#outerRimGrad);
    }

    .layer-main-block {
      fill: url(#mainBlockGrad);
    }

    .layer-yellow-text {
      fill: var(--yellow-color, #ffee00);
    }

    .layer-black-text {
      fill: var(--black-color, #000000);
    }
  </style>
</head>
<body>

  <!-- Top Bar with Back Button, Color Customizer on top, and Layer Toggles underneath -->
  <div class="top-bar">
    <div class="back-btn-container">
      <img id="btnBack" class="btn" src="img/btn_back.png" alt="Back" title="Go Back">
    </div>

    <div class="right-panels">
      <!-- Custom Hex Color Panel using img/GJ_square01-uhd.png -->
      <div class="color-panel">
        <div class="color-panel-header">
          <div class="color-panel-title">Colors</div>
          <img id="btnReset" class="btn reset-btn" src="img/btn_reset.png" alt="Reset Colors" title="Reset Colors">
        </div>

        <!-- 1. Black Text -->
        <div class="color-row">
          <span class="color-label">Black Text</span>
          <div class="hex-inputs">
            <div class="color-swatch-wrapper">
              <span id="swatchBlack" class="color-swatch" style="background: #000000;" title="Click swatch to pick color"></span>
              <input type="color" id="pickerBlack" class="color-picker-native" value="#000000">
            </div>
            <input id="hexBlack" class="hex-input" type="text" maxlength="6" value="000000" placeholder="000000" spellcheck="false">
          </div>
        </div>

        <!-- 2. Yellow Text -->
        <div class="color-row">
          <span class="color-label">Yellow Text</span>
          <div class="hex-inputs">
            <div class="color-swatch-wrapper">
              <span id="swatchYellow" class="color-swatch" style="background: #FFEE00;" title="Click swatch to pick color"></span>
              <input type="color" id="pickerYellow" class="color-picker-native" value="#FFEE00">
            </div>
            <input id="hexYellow" class="hex-input" type="text" maxlength="6" value="FFEE00" placeholder="FFEE00" spellcheck="false">
          </div>
        </div>

        <!-- 3. Text BG Gradient (Top / Bottom) -->
        <div class="color-row">
          <span class="color-label">Text BG Gradient</span>
          <div class="hex-inputs">
            <div class="color-swatch-wrapper">
              <span id="swatchMainTop" class="color-swatch" style="background: #FEB403;" title="Top Color"></span>
              <input type="color" id="pickerMainTop" class="color-picker-native" value="#FEB403">
            </div>
            <input id="hexMainTop" class="hex-input" type="text" maxlength="6" value="FEB403" placeholder="FEB403" spellcheck="false">

            <div class="color-swatch-wrapper">
              <span id="swatchMainBot" class="color-swatch" style="background: #FF8201;" title="Bottom Color"></span>
              <input type="color" id="pickerMainBot" class="color-picker-native" value="#FF8201">
            </div>
            <input id="hexMainBot" class="hex-input" type="text" maxlength="6" value="FF8201" placeholder="FF8201" spellcheck="false">
          </div>
        </div>

        <!-- 4. Text BG Gradient Outline (Top / Bottom) -->
        <div class="color-row">
          <span class="color-label">Text BG Outline</span>
          <div class="hex-inputs">
            <div class="color-swatch-wrapper">
              <span id="swatchOuterTop" class="color-swatch" style="background: #FEEF78;" title="Top Color"></span>
              <input type="color" id="pickerOuterTop" class="color-picker-native" value="#FEEF78">
            </div>
            <input id="hexOuterTop" class="hex-input" type="text" maxlength="6" value="FEEF78" placeholder="FEEF78" spellcheck="false">

            <div class="color-swatch-wrapper">
              <span id="swatchOuterBot" class="color-swatch" style="background: #F15D03;" title="Bottom Color"></span>
              <input type="color" id="pickerOuterBot" class="color-picker-native" value="#F15D03">
            </div>
            <input id="hexOuterBot" class="hex-input" type="text" maxlength="6" value="F15D03" placeholder="F15D03" spellcheck="false">
          </div>
        </div>

        <!-- 5. Shadow -->
        <div class="color-row">
          <span class="color-label">Shadow</span>
          <div class="hex-inputs">
            <div class="color-swatch-wrapper">
              <span id="swatchShadow" class="color-swatch" style="background: #000000;" title="Click swatch to pick color"></span>
              <input type="color" id="pickerShadow" class="color-picker-native" value="#000000">
            </div>
            <input id="hexShadow" class="hex-input" type="text" maxlength="6" value="000000" placeholder="000000" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- Layer Toggles moved underneath the Color Panel -->
      <div class="layer-toggles">
        <div class="toggle-row">
          <span class="toggle-label">Black Text</span>
          <img id="toggleBlack" class="btn toggle-btn" src="img/btn_on.png" alt="Toggle Black Text" data-layer="black">
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Yellow Text</span>
          <img id="toggleYellow" class="btn toggle-btn" src="img/btn_on.png" alt="Toggle Yellow Text" data-layer="yellow">
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Text Background</span>
          <img id="toggleMain" class="btn toggle-btn" src="img/btn_on.png" alt="Toggle Text Background" data-layer="main">
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Text Background Outline</span>
          <img id="toggleOuter" class="btn toggle-btn" src="img/btn_on.png" alt="Toggle Text Background Outline" data-layer="outer">
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Shadow</span>
          <img id="toggleShadow" class="btn toggle-btn" src="img/btn_on.png" alt="Toggle Shadow" data-layer="shadow">
        </div>
      </div>
    </div>
  </div>

  <div class="logo-stage" id="logoStage">
    <svg id="logoSvg" xmlns="http://www.w3.org/2000/svg">
      <defs id="svgDefs">
        <!-- Main block gradient -->
        <linearGradient id="mainBlockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#feb403" />
          <stop offset="100%" stop-color="#ff8201" />
        </linearGradient>

        <!-- Outer rim gradient -->
        <linearGradient id="outerRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#feef78" />
          <stop offset="100%" stop-color="#f15d03" />
        </linearGradient>

        <!-- Proportional blurred shadow filter -->
        <filter id="uniformShadow10" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blurOut" />
        </filter>
      </defs>

      <!-- Exact Global Layer Containers (Zero Separation Wrappers) -->
      <g id="groupShadow"></g>
      <g id="groupOuter"></g>
      <g id="groupMain"></g>
      <g id="groupYellow"></g>
      <g id="groupBlack"></g>
    </svg>
  </div>

  <div class="controls">
    <div class="gj-frame">
      <div class="message-label">Message</div>
      <textarea id="logoInput" rows="1" placeholder="Type Something!" autocomplete="off"></textarea>
      
      <!-- Action Buttons Row with btn class for animations -->
      <div class="button-row">
        <img id="btnDownload" class="btn action-btn" src="img/btn_download.png" alt="Download Logo" title="Download PNG">
        <img id="btnCopy" class="btn action-btn" src="img/btn_copy.png" alt="Copy Logo" title="Copy Image">
      </div>
    </div>
  </div>

  <!-- Copied Notification Element -->
  <div id="copyNotification" class="copy-notification">Copied!</div>

  <script>
    const input = document.getElementById('logoInput');
    const svg = document.getElementById('logoSvg');
    const svgDefs = document.getElementById('svgDefs');

    const groupShadow = document.getElementById('groupShadow');
    const groupOuter = document.getElementById('groupOuter');
    const groupMain = document.getElementById('groupMain');
    const groupYellow = document.getElementById('groupYellow');
    const groupBlack = document.getElementById('groupBlack');

    // Layer visibility state tracker
    const layerStates = {
      shadow: true,
      outer: true,
      main: true,
      yellow: true,
      black: true
    };

    // Custom hex colors (stored without #)
    const customColors = {
      black: '000000',
      yellow: 'FFEE00',
      mainTop: 'FEB403',
      mainBot: 'FF8201',
      outerTop: 'FEEF78',
      outerBot: 'F15D03',
      shadow: '000000'
    };

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const DEFAULT_LINES = ['RobTop Games', 'Logo Generator!'];
    const LINE_HEIGHT = 26;

    function normalizeHex(raw) {
      const cleaned = raw.replace(/[^0-9a-fA-F]/g, '').toUpperCase();
      if (cleaned.length === 6) return `#${cleaned}`;
      if (cleaned.length === 3) {
        return `#${cleaned[0]}${cleaned[0]}${cleaned[1]}${cleaned[1]}${cleaned[2]}${cleaned[2]}`;
      }
      return null;
    }

    function applyColorsToLogo() {
      const blackHex = normalizeHex(customColors.black) || '#000000';
      const yellowHex = normalizeHex(customColors.yellow) || '#FFEE00';
      const mainTopHex = normalizeHex(customColors.mainTop) || '#FEB403';
      const mainBotHex = normalizeHex(customColors.mainBot) || '#FF8201';
      const outerTopHex = normalizeHex(customColors.outerTop) || '#FEEF78';
      const outerBotHex = normalizeHex(customColors.outerBot) || '#F15D03';
      const shadowHex = normalizeHex(customColors.shadow) || '#000000';

      document.documentElement.style.setProperty('--black-color', blackHex);
      document.documentElement.style.setProperty('--yellow-color', yellowHex);
      document.documentElement.style.setProperty('--shadow-color', shadowHex);

      const mainStops = svgDefs.querySelectorAll('#mainBlockGrad stop');
      if (mainStops.length >= 2) {
        mainStops[0].setAttribute('stop-color', mainTopHex);
        mainStops[1].setAttribute('stop-color', mainBotHex);
      }

      const outerStops = svgDefs.querySelectorAll('#outerRimGrad stop');
      if (outerStops.length >= 2) {
        outerStops[0].setAttribute('stop-color', outerTopHex);
        outerStops[1].setAttribute('stop-color', outerBotHex);
      }

      const shadowFlood = svgDefs.querySelector('#shadowFlood');
      if (shadowFlood) {
        shadowFlood.setAttribute('flood-color', shadowHex);
      }
    }

    function bindColorControls(inputId, swatchId, pickerId, colorKey, fallbackHex) {
      const el = document.getElementById(inputId);
      const swatch = document.getElementById(swatchId);
      const picker = document.getElementById(pickerId);
      if (!el) return;

      const updateValues = (hexValue) => {
        const sanitized = hexValue.replace(/[^0-9a-fA-F]/g, '').toUpperCase().slice(0, 6);
        el.value = sanitized;
        const valid = normalizeHex(sanitized);
        if (valid) {
          customColors[colorKey] = sanitized;
          if (swatch) swatch.style.background = valid;
          if (picker) picker.value = valid;
          applyColorsToLogo();
        }
      };

      el.addEventListener('input', () => {
        updateValues(el.value);
      });

      el.addEventListener('blur', () => {
        const valid = normalizeHex(el.value);
        if (!valid) {
          updateValues(fallbackHex);
        }
      });

      if (swatch && picker) {
        swatch.addEventListener('click', () => {
          picker.click();
        });
      }

      if (picker) {
        picker.addEventListener('input', () => {
          const val = picker.value; // e.g. #ff0000
          updateValues(val.replace('#', ''));
        });
      }
    }

    bindColorControls('hexBlack', 'swatchBlack', 'pickerBlack', 'black', '000000');
    bindColorControls('hexYellow', 'swatchYellow', 'pickerYellow', 'yellow', 'FFEE00');
    bindColorControls('hexMainTop', 'swatchMainTop', 'pickerMainTop', 'mainTop', 'FEB403');
    bindColorControls('hexMainBot', 'swatchMainBot', 'pickerMainBot', 'mainBot', 'FF8201');
    bindColorControls('hexOuterTop', 'swatchOuterTop', 'pickerOuterTop', 'outerTop', 'FEEF78');
    bindColorControls('hexOuterBot', 'swatchOuterBot', 'pickerOuterBot', 'outerBot', 'F15D03');
    bindColorControls('hexShadow', 'swatchShadow', 'pickerShadow', 'shadow', '000000');

    function resetColors() {
      const defaultColors = {
        Black: '000000',
        Yellow: 'FFEE00',
        MainTop: 'FEB403',
        MainBot: 'FF8201',
        OuterTop: 'FEEF78',
        OuterBot: 'F15D03',
        Shadow: '000000'
      };

      for (const [key, val] of Object.entries(defaultColors)) {
        const lowerKey = key === 'MainTop' ? 'mainTop' : key === 'MainBot' ? 'mainBot' : key === 'OuterTop' ? 'outerTop' : key === 'OuterBot' ? 'outerBot' : key.toLowerCase();
        customColors[lowerKey] = val;

        const el = document.getElementById(`hex${key}`);
        const swatch = document.getElementById(`swatch${key}`);
        const picker = document.getElementById(`picker${key}`);

        if (el) el.value = val;
        if (swatch) swatch.style.background = `#${val}`;
        if (picker) picker.value = `#${val}`;
      }
      applyColorsToLogo();
    }

    function getLines(rawValue) {
      if (rawValue.trim().length === 0) {
        return DEFAULT_LINES;
      }
      return rawValue.split('\n').map(line => line.length > 0 ? line : ' ');
    }

    function autoGrowTextarea() {
      input.style.height = 'auto';
      input.style.height = `${input.scrollHeight}px`;
    }

    function renderLines(lines) {
      const blackHex = normalizeHex(customColors.black) || '#000000';
      const yellowHex = normalizeHex(customColors.yellow) || '#FFEE00';
      const mainTopHex = normalizeHex(customColors.mainTop) || '#FEB403';
      const mainBotHex = normalizeHex(customColors.mainBot) || '#FF8201';
      const outerTopHex = normalizeHex(customColors.outerTop) || '#FEEF78';
      const outerBotHex = normalizeHex(customColors.outerBot) || '#F15D03';
      const shadowHex = normalizeHex(customColors.shadow) || '#000000';

      svgDefs.innerHTML = `
        <linearGradient id="mainBlockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="${mainTopHex}" />
          <stop offset="100%" stop-color="${mainBotHex}" />
        </linearGradient>

        <linearGradient id="outerRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="${outerTopHex}" />
          <stop offset="100%" stop-color="${outerBotHex}" />
        </linearGradient>

        <filter id="uniformShadow10" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blurOut" />
          <feFlood id="shadowFlood" flood-color="${shadowHex}" result="shadowColor" />
          <feComposite in="shadowColor" in2="blurOut" operator="in" />
        </filter>
      `;

      groupShadow.innerHTML = '';
      groupOuter.innerHTML = '';
      groupMain.innerHTML = '';
      groupYellow.innerHTML = '';
      groupBlack.innerHTML = '';

      const totalLines = lines.length;
      const startY = -((totalLines - 1) * LINE_HEIGHT) / 2;

      lines.forEach((line, index) => {
        const yPos = startY + (index * LINE_HEIGHT);
        const outerMaskId = `outerMask-${index}`;
        const mainMaskId = `mainMask-${index}`;

        function createMask(maskId, strokeWidth) {
          const mask = document.createElementNS(SVG_NS, 'mask');
          mask.setAttribute('id', maskId);

          const bg = document.createElementNS(SVG_NS, 'rect');
          bg.setAttribute('x', '-2500');
          bg.setAttribute('y', '-1500');
          bg.setAttribute('width', '5000');
          bg.setAttribute('height', '3000');
          bg.setAttribute('fill', 'black');
          mask.appendChild(bg);

          const text = document.createElementNS(SVG_NS, 'text');
          text.setAttribute('class', 'logo-text');
          text.setAttribute('x', '0');
          text.setAttribute('y', yPos);
          text.setAttribute('fill', 'white');
          text.setAttribute('stroke', 'white');
          text.setAttribute('stroke-width', strokeWidth);
          text.setAttribute('stroke-linejoin', 'round');
          text.setAttribute('stroke-linecap', 'round');
          text.textContent = line;
          mask.appendChild(text);

          const offsets = [
            {dx: 0, dy: -2}, {dx: 0, dy: 2},
            {dx: -2, dy: 0}, {dx: 2, dy: 0},
            {dx: 0, dy: 0}
          ];
          offsets.forEach(offset => {
            const fillPass = document.createElementNS(SVG_NS, 'text');
            fillPass.setAttribute('class', 'logo-text');
            fillPass.setAttribute('x', offset.dx);
            fillPass.setAttribute('y', yPos + offset.dy);
            fillPass.setAttribute('fill', 'white');
            fillPass.textContent = line;
            mask.appendChild(fillPass);
          });

          svgDefs.appendChild(mask);
        }

        createMask(outerMaskId, 8.5);
        createMask(mainMaskId, 6.5);

        function createMaskedRect(maskId, className, fillValue, offsetY = 0) {
          const rect = document.createElementNS(SVG_NS, 'rect');
          rect.setAttribute('class', className);
          rect.setAttribute('x', '-2000');
          rect.setAttribute('y', yPos - 27.5 + offsetY);
          rect.setAttribute('width', '4000');
          rect.setAttribute('height', '55');
          rect.setAttribute('fill', fillValue);
          rect.setAttribute('mask', `url(#${maskId})`);
          return rect;
        }

        function createTextElement(className, offsetX = 0, offsetY = 0) {
          const t = document.createElementNS(SVG_NS, 'text');
          t.setAttribute('class', `logo-text ${className}`);
          t.setAttribute('x', offsetX);
          t.setAttribute('y', yPos + offsetY);
          t.textContent = line;
          return t;
        }

        const shadowText = document.createElementNS(SVG_NS, 'text');
        shadowText.setAttribute('class', 'logo-text layer-shadow');
        shadowText.setAttribute('x', '0');
        shadowText.setAttribute('y', yPos);
        shadowText.textContent = line;
        groupShadow.appendChild(shadowText);

        groupOuter.appendChild(createMaskedRect(outerMaskId, 'layer-outer-rim', 'url(#outerRimGrad)', 0));
        groupMain.appendChild(createMaskedRect(mainMaskId, 'layer-main-block', 'url(#mainBlockGrad)', 0));
        groupYellow.appendChild(createTextElement('layer-yellow-text', 0.25, 0.25));
        groupBlack.appendChild(createTextElement('layer-black-text', 0, 0));
      });

      applyColorsToLogo();
      applyLayerVisibility();
      resizeSvg(lines);
    }

    function applyLayerVisibility() {
      groupShadow.style.display = layerStates.shadow ? '' : 'none';
      groupOuter.style.display = layerStates.outer ? '' : 'none';
      groupMain.style.display = layerStates.main ? '' : 'none';
      groupYellow.style.display = layerStates.yellow ? '' : 'none';
      groupBlack.style.display = layerStates.black ? '' : 'none';
    }

    function getTightBox(lines) {
      const maxLen = Math.max(...lines.map(l => l.length), 4);
      const vbWidth = Math.max(300, maxLen * 12 + 10);
      const vbHeight = Math.max(60, lines.length * LINE_HEIGHT + 10);
      const vbX = -vbWidth / 2;
      const vbY = -vbHeight / 2;
      return { vbX, vbY, vbWidth, vbHeight };
    }

    function resizeSvg(lines) {
      const box = getTightBox(lines);
      svg.setAttribute('viewBox', `${box.vbX} ${box.vbY} ${box.vbWidth} ${box.vbHeight}`);
    }

    /* Helper to convert pusab font to base64 so canvas rendering matches properly */
    let cachedFontDataUri = null;
    async function getPusabFontDataUri() {
      if (cachedFontDataUri) return cachedFontDataUri;
      try {
        const res = await fetch('fonts/pusab.otf');
        if (!res.ok) return null;
        const blob = await res.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            cachedFontDataUri = reader.result;
            resolve(cachedFontDataUri);
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return null;
      }
    }

    /* Button Press Animation & Click Handler using btnAnim.css classes */
    function attachButtonEffects(btnId, onClickCallback) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      const pressDown = () => {
        btn.classList.remove('gd-release');
        void btn.offsetWidth;
        btn.classList.add('gd-hold');
      };

      const releaseUp = () => {
        if (btn.classList.contains('gd-hold')) {
          btn.classList.remove('gd-hold');
          btn.classList.add('gd-release');
        }
      };

      btn.addEventListener('mousedown', pressDown);
      btn.addEventListener('mouseup', releaseUp);
      btn.addEventListener('mouseleave', releaseUp);

      btn.addEventListener('touchstart', pressDown, { passive: true });
      btn.addEventListener('touchend', releaseUp, { passive: true });

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        onClickCallback();
      });
    }

    attachButtonEffects('btnBack', () => {
      window.location.href = '../';
    });

    attachButtonEffects('btnReset', resetColors);

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      const layerKey = btn.getAttribute('data-layer');
      attachButtonEffects(btn.id, () => {
        layerStates[layerKey] = !layerStates[layerKey];
        btn.src = layerStates[layerKey] ? 'img/btn_on.png' : 'img/btn_off.png';
        applyLayerVisibility();
      });
    });

    async function generateLogoBlob() {
      await document.fonts.ready;
      const fontDataUri = await getPusabFontDataUri();
      const lines = getLines(input.value);
      const box = getTightBox(lines);

      const blackHex = normalizeHex(customColors.black) || '#000000';
      const yellowHex = normalizeHex(customColors.yellow) || '#FFEE00';
      const shadowHex = normalizeHex(customColors.shadow) || '#000000';

      const clonedSvg = svg.cloneNode(true);
      clonedSvg.setAttribute('xmlns', SVG_NS);
      clonedSvg.setAttribute('width', box.vbWidth);
      clonedSvg.setAttribute('height', box.vbHeight);
      clonedSvg.setAttribute('viewBox', `${box.vbX} ${box.vbY} ${box.vbWidth} ${box.vbHeight}`);
      
      const fontFaceRule = fontDataUri
        ? `@font-face { font-family: 'Pusab'; src: url('${fontDataUri}') format('opentype'); }`
        : '';

      const styleEl = document.createElementNS(SVG_NS, 'style');
      styleEl.textContent = `
        ${fontFaceRule}
        .logo-text {
          font-family: 'Pusab', sans-serif;
          font-size: 20px;
          letter-spacing: -0.2px;
          word-spacing: 4px;
          text-anchor: middle;
          dominant-baseline: central;
          stroke-linejoin: round;
          stroke-linecap: round;
          paint-order: stroke fill;
        }
        .layer-shadow {
          fill: ${shadowHex};
          filter: url(#uniformShadow10);
          opacity: 1;
        }
        .layer-outer-rim {
          fill: url(#outerRimGrad);
        }
        .layer-main-block {
          fill: url(#mainBlockGrad);
        }
        .layer-yellow-text {
          fill: ${yellowHex};
        }
        .layer-black-text {
          fill: ${blackHex};
        }
      `;
      clonedSvg.insertBefore(styleEl, clonedSvg.firstChild);

      const svgString = new XMLSerializer().serializeToString(clonedSvg);
      const svgBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));

      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = 4;
          canvas.width = box.vbWidth * scale;
          canvas.height = box.vbHeight * scale;
          const context = canvas.getContext('2d');
          context.scale(scale, scale);
          context.drawImage(image, 0, 0);

          const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
          let found = false;

          for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
              const alpha = data[(y * canvas.width + x) * 4 + 3];
              if (alpha > 0) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
                found = true;
              }
            }
          }

          if (!found) {
            canvas.toBlob((blob) => resolve(blob), 'image/png');
            return;
          }

          const cropWidth = maxX - minX + 1;
          const cropHeight = maxY - minY + 1;
          const croppedCanvas = document.createElement('canvas');
          croppedCanvas.width = cropWidth;
          croppedCanvas.height = cropHeight;
          const croppedCtx = croppedCanvas.getContext('2d');
          croppedCtx.drawImage(canvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

          croppedCanvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('Canvas toBlob failed'));
          }, 'image/png');
        };
        image.onerror = (err) => reject(err);
        image.src = svgBase64;
      });
    }

    function showCopyNotification(message = 'Copied!') {
      const note = document.getElementById('copyNotification');
      note.textContent = message;
      note.classList.add('show');
      setTimeout(() => {
        note.classList.remove('show');
      }, 2000);
    }

    attachButtonEffects('btnDownload', async () => {
      try {
        const blob = await generateLogoBlob();
        const url = URL.createObjectURL(blob);
        const downloadLink = document.createElement('a');
        downloadLink.href = url;
        const rawText = input.value.trim() || 'RobTop Games';
        const safeName = rawText.replace(/\s+/g, ' ').replace(/[\/\\?%*:|"<>]/g, '_');
        downloadLink.download = `${safeName}.png`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        console.error('Download failed:', err);
      }
    });

    attachButtonEffects('btnCopy', async () => {
      if (!navigator.clipboard || !window.ClipboardItem) {
        alert('Clipboard API with image support is not supported in this browser.');
        return;
      }
      try {
        const item = new ClipboardItem({
          'image/png': generateLogoBlob()
        });
        await navigator.clipboard.write([item]);
        showCopyNotification('Copied!');
      } catch (err) {
        console.error('Failed to copy image:', err);
        showCopyNotification('Copy Failed');
      }
    });

    input.addEventListener('input', (e) => {
      autoGrowTextarea();
      renderLines(getLines(e.target.value));
    });

    window.addEventListener('resize', () => resizeSvg(getLines(input.value)));

    input.value = '';
    autoGrowTextarea();
    renderLines(DEFAULT_LINES);

    getPusabFontDataUri();

    document.fonts.ready.then(() => {
      renderLines(getLines(input.value));
    });
    window.addEventListener('load', () => {
      renderLines(getLines(input.value));
    });
  </script>

</body>
</html>
