<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SapphixCatt - Tools</title>
    <link rel="icon" type="image/png" href="Favicons/tools.png">
    <link rel="stylesheet" href="btnAnim.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('img/GJ_gradientBG-hd.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* 4-Corner Art Layout */
        .corner-art {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            width: 250px;
            height: auto;
        }

        .bottom-left {
            bottom: 0;
            left: 0;
        }

        .bottom-right {
            bottom: 0;
            right: 0;
            transform: scaleX(-1);
        }

        .top-left {
            top: 0;
            left: 0;
            transform: scaleY(-1);
        }

        .top-right {
            top: 0;
            right: 0;
            transform: rotate(180deg);
        }

        /* Top Bar centered horizontally at the top, scaled to 0.8 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            transform-origin: top center;
            z-index: 5;
            pointer-events: none;
        }

        .top-bar img {
            display: block;
            height: auto;
            max-width: 100vw;
        }

        /* Top Left Back Button */
        .back-btn-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 90px;
        }

        /* Center RGLG Button (Scaled to 250% size: 320px * 2.5 = 800px) */
        .rglg-btn-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 800px;
        }

        .back-btn-container img,
        .rglg-btn-container img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <!-- 4-Corner Art -->
    <img src="img/GJ_sideArt_001.png" class="corner-art bottom-left" alt="Corner Art Bottom Left">
    <img src="img/GJ_sideArt_001.png" class="corner-art bottom-right" alt="Corner Art Bottom Right">
    <img src="img/GJ_sideArt_001.png" class="corner-art top-left" alt="Corner Art Top Left">
    <img src="img/GJ_sideArt_001.png" class="corner-art top-right" alt="Corner Art Top Right">

    <!-- Top Bar -->
    <div class="top-bar">
        <img src="img/GJ_topBar_001.png" alt="Top Bar">
    </div>

    <!-- Top Left Back Button -->
    <div class="back-btn-container">
        <div id="backBtn" class="btn">
            <img src="img/btn_back.png" alt="Back Button">
        </div>
    </div>

    <!-- Center Robtop Logo Generator Button (250% size) -->
    <div class="rglg-btn-container">
        <div id="rglgBtn" class="btn">
            <img src="img/btn_RGLG.png" alt="Robtop Logo Generator">
        </div>
    </div>

    <script>
        function setupGDButton(elementId, onClickCallback) {
            const btn = document.getElementById(elementId);
            if (!btn) return;

            let isMouseDown = false;
            let isHovered = true;

            btn.addEventListener('mouseenter', () => { isHovered = true; });
            btn.addEventListener('mouseleave', () => {
                isHovered = false;
                if (isMouseDown) {
                    isMouseDown = false;
                    btn.classList.remove('gd-hold');
                    void btn.offsetWidth;
                    btn.classList.add('gd-release');
                }
            });

            btn.addEventListener('mousedown', () => {
                isMouseDown = true;
                btn.classList.remove('gd-release', 'gd-hold');
                void btn.offsetWidth;
                btn.classList.add('gd-hold');
            });

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isMouseDown = true;
                btn.classList.remove('gd-release', 'gd-hold');
                void btn.offsetWidth;
                btn.classList.add('gd-hold');
            }, { passive: false });

            btn.addEventListener('mouseup', () => {
                if (isMouseDown) {
                    isMouseDown = false;
                    btn.classList.remove('gd-hold', 'gd-release');
                    if (isHovered && onClickCallback) {
                        onClickCallback();
                    }
                }
            });

            btn.addEventListener('touchend', () => {
                if (isMouseDown) {
                    isMouseDown = false;
                    btn.classList.remove('gd-hold', 'gd-release');
                    if (onClickCallback) {
                        onClickCallback();
                    }
                }
            });
        }

        // Back button: goes 1 directory behind to the parent directory
        setupGDButton('backBtn', () => {
            window.location.href = '../index.html';
        });

        // RGLG button: goes directly to Robtop Logo Generator with no cloaking
        setupGDButton('rglgBtn', () => {
            window.location.href = 'Robtop Logo Generator/index.html';
        });
    </script>

</body>
</html>
